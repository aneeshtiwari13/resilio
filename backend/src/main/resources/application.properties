spring.application.name=resilio-backend
server.port=8090

# Database Configuration (PostgreSQL primary with seamless H2 memory fallback)
spring.datasource.url=${DB_URL:jdbc:h2:mem:resiliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Resilio Self-Healing Engine & Health Monitoring
resilio.monitor.target-url=${TARGET_APP_URL:http://localhost:80}
resilio.monitor.target-blue-url=${TARGET_BLUE_URL:http://localhost:8081}
resilio.monitor.target-green-url=${TARGET_GREEN_URL:http://localhost:8082}
resilio.monitor.poll-interval-ms=${POLL_INTERVAL_MS:5000}
resilio.monitor.consecutive-failure-threshold=3
resilio.monitor.timeout-ms=2500
resilio.monitor.auto-rollback-enabled=${AUTO_ROLLBACK_ENABLED:false}

# Jenkins Integration Configuration
jenkins.url=${JENKINS_URL:http://localhost:8085}
jenkins.username=${JENKINS_USER:admin}
jenkins.api-token=${JENKINS_API_TOKEN:admin123}
jenkins.job-name=${JENKINS_JOB:resilio-pipeline}

# Selenium Infrastructure
selenium.grid-url=${SELENIUM_GRID_URL:http://localhost:4444/wd/hub}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
