version: '3.8'

services:
  # 1. Platform Relational Persistence
  postgres:
    image: postgres:16-alpine
    container_name: resilio-postgres
    environment:
      POSTGRES_DB: resilio
      POSTGRES_USER: resilio_user
      POSTGRES_PASSWORD: resilio_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resilio_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilio_user -d resilio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Resilio Control Plane Backend
  resilio-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resilio-backend
    ports:
      - "8090:8090"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resilio
      DB_USER: resilio_user
      DB_PASSWORD: resilio_secure_pass
      DB_DRIVER: org.postgresql.Driver
      JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      TARGET_APP_URL: http://nginx-proxy:80
      TARGET_BLUE_URL: http://demo-app-blue:8080
      TARGET_GREEN_URL: http://demo-app-green:8080
      JENKINS_URL: http://jenkins:8080
      SELENIUM_GRID_URL: http://selenium-chrome:4444/wd/hub
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/nginx:/app/deploy/nginx
    networks:
      - resilio_net

  # 3. Resilio Modern React Dashboard
  resilio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resilio-frontend
    ports:
      - "3000:80"
    depends_on:
      - resilio-backend
    networks:
      - resilio_net

  # 4. Blue/Green Dynamic Reverse Proxy
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: resilio-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - demo-app-blue
    networks:
      - resilio_net

  # 5. Target Workload: Blue Slot (Baseline Stable)
  demo-app-blue:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: resilio-demo-blue
    ports:
      - "8081:8080"
    environment:
      APP_ENVIRONMENT: blue
      APP_VERSION: "1.0.0"
      APP_COMMIT_SHA: "baseline-sha-982a17"
    networks:
      - resilio_net

  # 6. Target Workload: Green Slot (Candidate Slot)
  demo-app-green:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: resilio-demo-green
    ports:
      - "8082:8080"
    environment:
      APP_ENVIRONMENT: green
      APP_VERSION: "1.1.0"
      APP_COMMIT_SHA: "candidate-sha-47cf39"
    networks:
      - resilio_net

  # 7. Selenium Browser Test Grid
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: resilio-selenium-chrome
    ports:
      - "4444:4444"
      - "7900:7900" # VNC viewer port
    shm_size: 2gb
    networks:
      - resilio_net

  # 8. Jenkins Automation Engine
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile.jenkins
    container_name: resilio-jenkins
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - resilio_net

networks:
  resilio_net:
    driver: bridge

volumes:
  postgres_data:
  jenkins_home:
